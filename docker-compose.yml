version: '3.8'

services:
  
  db:
    image: postgres:16-alpine
    container_name: mlm-platform-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mlm_platform
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - mlm-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mlm_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    container_name: mlm-platform-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - mlm-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: mlm-platform-migrate
    environment:
      DATABASE_URL: "postgresql://postgres:postgres@db:5432/mlm_platform?schema=public"
    command: ["npx", "prisma", "migrate", "deploy"]
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mlm-network
    profiles:
      - migrate

volumes:
  postgres-data:
  redis-data:

networks:
  mlm-network:
    driver: bridge
